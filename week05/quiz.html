<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Quiz</title>
    <link href="styles/quiz.css" rel="stylesheet" />
</head>

<body>

    <h1>HTML & CSS Quiz</h1>

    <form action="#" method="post">

        <div class="form-item">
            <label for="q1">1. The standard element used to create a hyperlink in HTML is the ______
                element.</label>
            <input type="text" id="q1" name="q1" required>
        </div>


        <div class="form-item">
            <label for="q2">2. Briefly explain the purpose of the CSS Box Model and list its core
                components:</label>
            <textarea id="q2" name="q2" rows="4" cols="50" required></textarea>
        </div>


        <div class="form-item">
            <label for="q3">3. Which CSS property is used to change the background color of an
                element?</label>
            <select id="q3" name="q3" required>
                <option value="" selected disabled>Choose One ...</option>
                <option value="color">color</option>
                <option value="background-color">background-color</option>
                <option value="bgcolor">bgcolor</option>
            </select>
        </div>


        <div class="form-item">
            <label for="q4">4. How many main heading levels exist in HTML (from largest to
                smallest)?</label>
            <input type="number" id="q4" name="q4" required>
        </div>


        <div class="form-item">
            <label for="q5">5. What does the acronym CSS stand for?</label>
            <input type="text" id="q5" name="q5" required>
        </div>


        <div class="form-item">
            <label for="q6">6. Which HTML element is used to define an unordered list?</label>
            <select id="q6" name="q6" required>
                <option value="" selected disabled>Choose One ...</option>
                <option value="ol">&lt;ol&gt;</option>
                <option value="ul">&lt;ul&gt;</option>
                <option value="list">&lt;list&gt;</option>
            </select>
        </div>


        <div class="form-item">
            <label for="q7">7. What is the difference between class selectors and ID selectors in
                CSS?</label>
            <textarea id="q7" name="q7" rows="4" cols="50" required></textarea>
        </div>


        <button type="submit">Submit Quiz</button>
    </form>

</body>

</html>
