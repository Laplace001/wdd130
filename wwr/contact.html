<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"
  <title>Contact Us | Edwin Esekhaigbe</title>

  <meta name="description" content="Get in touch with Your Brand Name for customer support, inquiries, or partnership opportunities. Reach us by phone, email, or our online form.">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-area">
            <img src="images/logo.jpg" alt="White Water Rafting Adventures logo">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html" aria-current="page">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-hero-section">
            <h1>White Water Rafting Company</h1>
            <div class="company-info">
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
            </div>

            <div class="contact-grid">
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d144.9537363153169!3d-37.81627974202166!2m3!1f0!2f1000!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf0727d84d0c8003!2sVictoria%20St%2C%20Melbourne%20VIC%203000%2C%20Australia!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus" 
                        allowfullscreen="" loading="lazy"></iframe>
                </div>
                <div class="form-container">
                    <form action="#" method="post">
                        <fieldset>
                            <legend>Send Us a Message</legend>
                            
                            <div class="field">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" placeholder="your name" required>
                            </div>

                            <div class="field">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="your email" required>
                            </div>

                            <div class="field checkbox-group">
                                <span class="legend-label">Message Purpose</span>
                                <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                                <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                                <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                            </div>

                            <div class="field">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" rows="4" placeholder="Type here..." required></textarea>
                            </div>

                            <div class="field checkbox-inline">
                                <label><input type="checkbox" name="newsletter" value="subscribe"> Please subscribe me to the monthly newsletter</label>
                            </div>

                            <button type="submit" class="submit-btn">Get in Touch!</button>
                        </fieldset>
                    </form>
                </div>
            </div>
        </section>
        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile 1">
                    <figcaption>Employee Profile - Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile 2">
                    <figcaption>Employee Profile - Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile 3">
                    <figcaption>Employee Profile - Instructor</figcaption>
                </figure>
            </div>
        </section>  
       
    </main>

    <footer>
        <p>&copy; 2026 White Water Adventure | Edwin Esekhaigbe</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
