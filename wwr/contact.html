<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Experience unforgettable whitewater rafting adventures with Exciting Expeditions. Book guided river trips, family floats, and thrilling outdoor adventures today.">
    <meta name="author" content="Edwin Esekhaigbe">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"> -->
    <link rel="stylesheet" href="styles/rafting.css">
    <title>White Water Rafting | About Us </title>
</head>

<body>
    <header>

        <a href='index.html'>

            <img src="images/logo.jpg" alt="white-water-rafting-logo" />
        </a>
        <nav>
            <ul>

                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Company Information -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>

            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 (999) 999-9999</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Contact Section -->
        <section class="contact-section">

            <!-- Map -->
            <div class="map">
                <iframe
                  src="https://www.google.com/maps?q=Port+Harcourt,+Rivers,+Nigeria&output=embed"
                  width="100%" height="430" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <!-- Contact Form -->
            <div class="contact-form">

                <form>

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" placeholder="Placeholder">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Placeholder">
                    </div>

                    <div class="form-group">
                        <label>Message Purpose</label>

                        <div class="radio-group">
                            <label>
                                <input type="radio" name="purpose">
                                General Inquiry
                            </label>

                            <label>
                                <input type="radio" name="purpose">
                                Reservation Question
                            </label>

                            <label>
                                <input type="radio" name="purpose">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea placeholder="Type here"></textarea>
                    </div>

                    <div class="checkbox">
                        <label>
                            <input type="checkbox">
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>

        </section>

        <!-- Employees -->
        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-container">

                <div class="employee">
                    <img src="images/rafting26_600.jpg" alt="Evelyn Mmesoma">
                    <p>Miss. Evelyn Mmesoma</p>
                </div>

                <div class="employee">
                    <img src="images/rafting56_600.jpg" alt="Ukatu Mayor">
                    <p>Mr. Ukatu Mayor</p>
                </div>

                <div class="employee">
                    <img src="images/rafting56_600.jpg" alt="Timi Tamara">
                    <p>Mr. Timi Tamara</p>
                </div>

            </div>

        </section>
    </main>
    <footer>
        <p>&copy; 2026 Exciting Expeditions &bull; Edwin Esekhaigbe</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
