<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | White Water Rafting Adventures</title>
  <meta name="description" content="Get in touch with White Water Rafting Adventures for customer support, inquiries, or partnership opportunities. Reach us by phone, email, or our online form.">
  <meta name="author" content="Edwin Esekhaigbe">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <div class="container">

        <header>
            <div href="index.html" class="logo-area">>
                <div class="logo-icon">
                </div>
                <img src="images/logo.jpg" alt="White Water Rafting Adventures logo">
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html" class="active">Contact Us</a></li>
                </ul>
            </nav>
        </header>


        <main>
            <!-- Company Info -->
            <section class="company-info">
                <h1>White Water Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </section>


            <div class="content-wrapper">
                <!-- Map -->
                <div class="map-section">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d144.9537363153169!3d-37.81627974202166!2m3!1f0!2f1000!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf0727d84d0c8003!2sVictoria%20St%2C%20Melbourne%20VIC%203000%2C%20Australia!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus"
                        allowfullscreen="" loading="lazy"></iframe>

                </div>


                <div class="form-section">
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Placeholder">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Placeholder">
                        </div>
                        <div class="form-group" style="align-items: flex-start;">
                            <label>Message Purpose</label>
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" name="purpose" value="general" checked> General Inquiry
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="purpose" value="reservation"> Reservation Question
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="purpose" value="suggestion"> Website Suggestion
                                </label>
                            </div>
                        </div>

                        <div class="form-group" style="align-items: flex-start;">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" class="form-control"
                                placeholder="Type here..."></textarea>
                        </div>

                        <div class="newsletter-check">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                        </div>

                        <button type="submit" class="submit-btn">Get in Touch!</button>
                    </form>
                </div>
            </div>


            <section class="team-section">
                <h2>We Are Here to Serve You</h2>
                <div class="employees-grid">

                    <div class="employee-card">
                        <img src="images/image-head.png" alt="Portrait of the IT Head">
                    </div>

                    <div class="employee-card">
                        <img src="images/imagesales.png" alt="Portrait of the Sales Representative">
                    </div>

                    <div class="employee-card">
                        <img src="images/imagec.png" alt="Portrait of the Customer Service agent">
                        <p>Customer Service</p>
                    </div>

                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 White Water Adventure | Edwin Esekhaigbe</p>
            <nav class="socialmedia">
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                    <img src="./images/facebook.svg" alt="Facebook">
                </a>
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                    <img src="./images/linkedin.svg" alt="LinkedIn">
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                    <img src="./images/instagram.svg" alt="Instagram">
                </a>
            </nav>
        </footer>
</body>

</html>
